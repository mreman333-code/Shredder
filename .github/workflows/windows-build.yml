name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Headless: real bridge + MCP over stdio, and the packaging step against a
      # fixture archive. Neither opens an Electron window.
      - name: Headless checks
        run: npm test

      - name: Cache Electron archive
        uses: actions/cache@v4
        with:
          path: .cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build Windows app
        run: npm run dist:win

      - name: Verify packaged folder
        run: npm run check:package

      - name: Verify installer
        run: npm run check:installer

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path release/Shredder-win32-x64 -DestinationPath release/Shredder-win32-x64.zip -Force

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Shredder-win32-x64
          path: release/Shredder-win32-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Shredder-Setup
          path: release/Shredder-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
